# The OpenTelemetry Collector of the dev stack. It is the `otel` profile in
# docker-compose.dev.yml, and bin/otel-dev starts it. It takes OTLP/HTTP from
# telemetrygen. It sends each Log twice to EventStore's POST /v1/logs, and each
# Metric data point twice to POST /v1/metrics: once as protobuf with gzip (the
# Collector's default), and once as JSON with no compression.
#
# SOLIDTRACE_INGEST_URL is EventStore's ingest URL, with no path. The exporter
# adds /v1/logs and /v1/metrics. SOLIDTRACE_KEY is the Project's key. The defaults are the dev
# stack on :4000 and the seed Project's key. For a verify stack, set the two
# variables. bin/otel-dev sets them.
#
# The receiver listens on 14318 (HTTP). The Collector's own metrics are on
# 14888. Both ports are on loopback, so they cannot clash with a Collector of
# your own on 4317 or 4318. bin/otel-dev reads these counters to learn that the
# Collector sent every Log and every Metric data point.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:14318

processors:
  batch:
    # A short timeout, so that the Logs leave the Collector soon.
    timeout: 1s

exporters:
  # The name is otlp_http. The older name otlphttp is deprecated since 0.165.0.
  otlp_http/protobuf:
    endpoint: ${env:SOLIDTRACE_INGEST_URL:-http://127.0.0.1:4000}
    headers:
      Authorization: Bearer ${env:SOLIDTRACE_KEY:-testkey123}
    encoding: proto
    compression: gzip
  otlp_http/json:
    endpoint: ${env:SOLIDTRACE_INGEST_URL:-http://127.0.0.1:4000}
    headers:
      Authorization: Bearer ${env:SOLIDTRACE_KEY:-testkey123}
    encoding: json
    compression: none

service:
  telemetry:
    metrics:
      level: basic
      readers:
        - pull:
            exporter:
              prometheus:
                host: 127.0.0.1
                port: 14888
  pipelines:
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/protobuf, otlp_http/json]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/protobuf, otlp_http/json]
