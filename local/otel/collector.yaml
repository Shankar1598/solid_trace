# The OpenTelemetry Collector of the dev stack (the `otel` profile in
# docker-compose.dev.yml, started by bin/otel-dev). It takes OTLP/HTTP from
# telemetrygen and sends each Log twice to EventStore's POST /v1/logs: once as
# protobuf with gzip (the Collector's default) and once as JSON, with no
# compression.
#
# SOLIDTRACE_INGEST_URL is EventStore's ingest URL, with no path (the exporter
# adds /v1/logs). SOLIDTRACE_KEY is the Project's key. The defaults are the dev
# stack on :4000 and the seed Project's key, so a verify stack needs only the
# two variables (bin/otel-dev sets them).
#
# The receiver listens on 14318 (HTTP) and the Collector's own metrics on
# 14888, both on loopback, so they can't clash with a Collector of your own on
# 4317/4318. bin/otel-dev reads the metrics to know that the Collector sent
# every Log.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:14318

processors:
  batch:
    # A short timeout, so that the Logs leave the Collector soon.
    timeout: 1s

exporters:
  # The name is otlp_http: the older otlphttp is deprecated since 0.165.0.
  otlp_http/protobuf:
    endpoint: ${env:SOLIDTRACE_INGEST_URL:-http://127.0.0.1:4000}
    headers:
      Authorization: Bearer ${env:SOLIDTRACE_KEY:-testkey123}
    encoding: proto
    compression: gzip
  otlp_http/json:
    endpoint: ${env:SOLIDTRACE_INGEST_URL:-http://127.0.0.1:4000}
    headers:
      Authorization: Bearer ${env:SOLIDTRACE_KEY:-testkey123}
    encoding: json
    compression: none

service:
  telemetry:
    metrics:
      level: basic
      readers:
        - pull:
            exporter:
              prometheus:
                host: 127.0.0.1
                port: 14888
  pipelines:
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/protobuf, otlp_http/json]
