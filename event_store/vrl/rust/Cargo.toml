[package]
name = "st_vrl"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
# No default features: the stdlib without network, environment or system
# functions. See docs/adr/0012.
vrl = { version = "=0.37.0", default-features = false, features = ["stdlib-base", "enable_crypto_functions"] }
chrono = { version = "0.4", default-features = false }
rmp = "0.8"
rmpv = "1.3"

[profile.release]
panic = "unwind"
lto = false
codegen-units = 16
debug = false
