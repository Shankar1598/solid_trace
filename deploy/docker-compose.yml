name: solid-trace

# Rotated container logs. Docker's default json-file driver never rotates, so
# a busy install would fill the disk.
x-logging: &logging
  driver: local
  options:
    max-size: 50m
    max-file: "5"

# Console's image, shared by the dashboard, the background jobs and db_prepare.
x-console: &console
  # deploy/install sets SOLIDTRACE_VERSION: a release's tag, whose images it
  # pulls from GitHub's registry, or dev, which it builds from this checkout.
  image: ghcr.io/shankar1598/solid-trace-console:${SOLIDTRACE_VERSION:-dev}
  # Built by the console service or pulled by deploy/install, never by Compose.
  pull_policy: never
  network_mode: host
  environment: &console-environment
    RAILS_ENV: production
    HTTP_PORT: "3000"
    TARGET_PORT: "3001"
    # Without HTTPS, Thruster faces clients directly, so it ignores X-Forwarded-*
    # headers they send. With HTTPS, deploy/setup-gcp sets it to true: Caddy sets them.
    FORWARD_HEADERS: ${FORWARD_HEADERS:-false}
    # Optional: only Sentry's DSN is in the credentials.
    RAILS_MASTER_KEY: ${RAILS_MASTER_KEY:-}
    SECRET_KEY_BASE: ${SECRET_KEY_BASE:?run deploy/install, which writes it to deploy/.env}
    EVENT_STORE_URL: http://127.0.0.1:4100
    # Where Console sends an empty Project's test Log.
    EVENT_STORE_INGEST_URL: http://127.0.0.1:4000
    # Where SDKs and shippers reach ingest, for the Logs page's snippets.
    # Unset, they show this host at port 4000.
    PUBLIC_INGEST_URL: ${PUBLIC_INGEST_URL:-}
    # Console's public URL, from deploy/setup-gcp, for links in emails. The SMTP
    # server is set on Console's Email settings page.
    CONSOLE_URL: ${CONSOLE_URL:-}
  volumes:
    - ./data/storage:/storage
  restart: unless-stopped
  logging: *logging

services:
  # Dashboard. Thruster serves it on port 3000 and proxies to Puma on 3001.
  # The image runs as a non-root user, which can't bind a port below 1024 on
  # the host network, so Console isn't on port 80.
  console:
    <<: *console
    build: ../console
    depends_on:
      db_prepare:
        condition: service_completed_successfully

  # Background jobs
  jobs:
    <<: *console
    command: ["bin/jobs", "start"]
    depends_on:
      - console

  # Event ingestion and storage. Ingest listens on port 4000 directly, behind
  # Caddy on 4443 with HTTPS on.
  event_store:
    image: ghcr.io/shankar1598/solid-trace-event-store:${SOLIDTRACE_VERSION:-dev}
    pull_policy: never
    build: ../event_store
    network_mode: host
    environment:
      EVENT_STORE_CONFIG: /etc/solid-trace/event_store.yml
      # The object_store bucket's key, if event_store.yml has one.
      SOLIDTRACE_OBJECT_STORE_KEY_ID: ${SOLIDTRACE_OBJECT_STORE_KEY_ID:-}
      SOLIDTRACE_OBJECT_STORE_SECRET: ${SOLIDTRACE_OBJECT_STORE_SECRET:-}
    # Pebble's tables and DuckDB's Parquet files each hold a file descriptor.
    # 1048576 is the most the kernel allows by default (fs.nr_open).
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    volumes:
      - ./data/storage:/storage
      - ./data/storage_cold:/storage_cold
      - ./config:/etc/solid-trace:ro
    restart: unless-stopped
    # Room for DuckDB's checkpoint and an in-flight upload after the HTTP servers stop.
    stop_grace_period: 30s
    logging: *logging
    depends_on:
      db_prepare:
        condition: service_completed_successfully

  # TLS in front of Console (443) and ingest (4443), only with HTTPS on in
  # deploy/setup-gcp, which sets COMPOSE_PROFILES=https. It runs as root, so it can
  # bind ports 80 and 443.
  caddy:
    image: caddy:2.11.4-alpine
    profiles: [https]
    network_mode: host
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-}
    volumes:
      # The directory, not the file, so a git pull's new Caddyfile is seen.
      - ./caddy:/etc/caddy:ro
      # Certificates. Kept across restarts, or Let's Encrypt's rate limits bite.
      - ./data/caddy:/data
    restart: unless-stopped
    logging: *logging

  # Creates or migrates Console's tables, which EventStore also writes, seeds
  # the Meta Organization once (docs/adr/0011), then exits.
  db_prepare:
    <<: *console
    environment:
      <<: *console-environment
      # Its Project's key, which deploy/install writes. Unset, nothing is seeded.
      META_PROJECT_KEY: ${META_PROJECT_KEY:-}
    command: ["bin/rails", "db:prepare", "meta_organization:seed"]
    restart: "no"
    # So Vector is reading the containers' output before db_prepare writes any.
    depends_on:
      - vector

  # Sends every other service's output to the Meta Organization's Project as
  # Logs, through Log ingest on port 4000 (docs/adr/0011). Lines written while
  # it is down are not sent; they stay in `docker compose logs`.
  vector:
    image: timberio/vector:0.58.0-alpine
    network_mode: host
    environment:
      # The same key db_prepare seeds the Project with.
      META_PROJECT_KEY: ${META_PROJECT_KEY:-}
      # The only way the key above reaches vector.yaml (checked on 0.58.0): off
      # by default since Vector 0.5x, so a config from elsewhere can't read the
      # environment; this one is ours. Without it Vector sends the literal
      # ${META_PROJECT_KEY} and every request gets a 401.
      VECTOR_DANGEROUSLY_ALLOW_ENV_VAR_INTERPOLATION: "true"
    volumes:
      # Read-only, but access to the socket is still root on the VM.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # The directory, not the file, so a git pull's new vector.yaml is seen.
      - ./vector:/etc/vector:ro
    restart: unless-stopped
    logging: *logging
