version: "3.9"

services:
  # Dashboard. Thruster serves it on port 80 and proxies to Puma.
  # The image runs as a non-root user, which can't bind port 80 on the host
  # network (cap_add doesn't help a non-root user). Allow it on the host:
  #   sysctl net.ipv4.ip_unprivileged_port_start=80   (persist in /etc/sysctl.d/)
  console: &console
    image: solid-trace-console:latest
    network_mode: host
    environment:
      RAILS_ENV: production
      # Thruster faces clients directly, so it ignores X-Forwarded-* headers they send.
      FORWARD_HEADERS: "false"
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      EVENT_STORE_URL: http://127.0.0.1:4100
    volumes:
      - /var/lib/solid-trace/storage:/storage
    restart: unless-stopped
    depends_on:
      - db_prepare

  # Background jobs
  jobs:
    <<: *console
    command: ["bin/jobs", "start"]
    depends_on:
      - console

  # Event ingestion and storage. Ingest listens on port 4000 directly.
  event_store:
    image: solid-trace-event-store:latest
    network_mode: host
    environment:
      EVENT_STORE_CONFIG: /etc/solid-trace/event_store.yml
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    volumes:
      - /var/lib/solid-trace/storage:/storage
      - /var/lib/solid-trace/storage_cold:/storage_cold
      - /etc/solid-trace/event_store.yml:/etc/solid-trace/event_store.yml:ro
    restart: unless-stopped
    depends_on:
      - db_prepare

  db_prepare:
    <<: *console
    command: ["bin/rails", "db:prepare"]
