# Event Store configuration.
# Any key here overrides the defaults in config.go.

ingest_socket: /var/run/solid-trace/event_store.sock
pebble_path: /storage/pebble/production/events
duckdb_path: /storage/duckdb/production/events.duckdb
sqlite_path: /storage/sqlite/production/solid_trace.sqlite3
message_queue_path: /storage/sqlite/production/message_queue.sqlite3

# Store DuckDB parquet archives on slower storage.
parquet_storage_path: /storage_cold/duckdb/production/events_parquet

# DuckDB memory and spill-to-disk settings
# duckdb_temp_directory: /storage_local/duckdb/tmp
# duckdb_memory_limit: 16GB
