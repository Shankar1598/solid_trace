\* spec: LogIngest
\* EventStore's process can die, and a ClickHouse insert can fail, before or after it writes.
SPECIFICATION Spec
CONSTANTS
  N = 2
  MaxPer = 2
  MaxScans = 3
  ProcessCanCrash = TRUE
  PowerCanFail = FALSE
  ClickHouseSyncsParts = FALSE
  WindowCanPass = FALSE
INVARIANTS
  TypeOK
  NoLogStoredTwice
  NoLoggedLogLost
  NoAcceptedLogLost
  MatchReadsEachLogOnce
  MatchMissesNoLog
