\* spec: LogIngest
\* The machine can lose power, and ClickHouse syncs each part before it answers (fsync_after_insert).
SPECIFICATION Spec
CONSTANTS
  N = 2
  MaxPer = 2
  MaxScans = 3
  ProcessCanCrash = TRUE
  PowerCanFail = TRUE
  ClickHouseSyncsParts = TRUE
  WindowCanPass = FALSE
INVARIANTS
  TypeOK
  NoLogStoredTwice
  NoLoggedLogLost
  NoAcceptedLogLost
  MatchReadsEachLogOnce
  MatchMissesNoLog
