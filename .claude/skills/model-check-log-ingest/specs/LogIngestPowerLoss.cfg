\* spec: LogIngest
\* The machine can lose power, and ClickHouse does not sync its parts (its default).
SPECIFICATION Spec
CONSTANTS
  N = 2
  MaxPer = 2
  MaxScans = 3
  ProcessCanCrash = TRUE
  PowerCanFail = TRUE
  ClickHouseSyncsParts = FALSE
  WindowCanPass = FALSE
INVARIANTS
  TypeOK
  NoLogStoredTwice
  NoLoggedLogLost
  NoAcceptedLogLost
  MatchReadsEachLogOnce
  MatchMissesNoLog
