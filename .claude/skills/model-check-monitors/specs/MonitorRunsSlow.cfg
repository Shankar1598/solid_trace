\* spec: MonitorRuns
\* A run can take longer than RUN_LEASE (5 minutes), and another run then takes the Monitor.
SPECIFICATION Spec
CONSTANTS
  Runs = {"job", "runNow"}
  MaxBatches = 2
  MaxSaves = 1
  LeaseCanExpire = TRUE
INVARIANTS
  TypeOK
  NoLogMatchedTwice
  NoLogMissed
  NoStaleWrite
  NoWriteOverASave
  OneRunAtATime
