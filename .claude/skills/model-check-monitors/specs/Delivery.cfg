\* spec: Delivery
\* Each tick ends within 2 minutes of its dispatch, and no process dies.
SPECIFICATION Spec
CONSTANTS
  MaxTicks = 4
  MaxTries = 2
  SendCanFail = TRUE
  LockCanExpire = FALSE
  TicksCanDie = FALSE
  WritersCanDie = FALSE
INVARIANTS
  TypeOK
  SentAtMostOnce
  ResolveAfterTrigger
  NoRowLeftBehind
