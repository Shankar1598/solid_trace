\* spec: Delivery
\* The Monitor status chain: a not running, then a running again. Each tick
\* ends within 2 minutes of its dispatch, and no process dies.
SPECIFICATION Spec
CONSTANTS
  MaxTicks = 4
  MaxTries = 2
  SendCanFail = TRUE
  LockCanExpire = FALSE
  TicksCanDie = FALSE
  WritersCanDie = FALSE
  StatusChain = TRUE
INVARIANTS
  TypeOK
  SentAtMostOnce
  ResolveAfterTrigger
  NoRowLeftBehind
  NoResolveAlone
