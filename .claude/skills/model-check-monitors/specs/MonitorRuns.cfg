\* spec: MonitorRuns
\* Runs end within RUN_LEASE (5 minutes), as the code assumes.
SPECIFICATION Spec
CONSTANTS
  Runs = {"job", "runNow"}
  MaxBatches = 2
  MaxSaves = 1
  LeaseCanExpire = FALSE
INVARIANTS
  TypeOK
  NoLogMatchedTwice
  NoLogMissed
  NoStaleWrite
  NoWriteOverASave
  OneRunAtATime
