# SQLite. Versions 3.8.0 and up are supported.
#   gem install sqlite3
#
#   Ensure the SQLite 3 gem is defined in your Gemfile
#   gem "sqlite3"
#
default: &default
  adapter: sqlite3
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000
  pragmas:
    journal_mode: wal
    synchronous: normal
    # Use 25MB of cache per connection
    cache_size: -25000

development:
  primary:
    <<: *default
    database: storage/sqlite/solid_trace_development.sqlite3
  queue:
    <<: *default
    database: storage/sqlite/solid_trace_development_queue.sqlite3
    migrations_paths: db/queue_migrate
  message_queue:
    <<: *default
    database: storage/sqlite/solid_trace_development_message_queue.sqlite3
    migrations_paths: db/message_queue_migrate
  cache:
    <<: *default
    database: storage/sqlite/solid_trace_development_cache.sqlite3
    migrations_paths: db/cache_migrate

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  primary:
    <<: *default
    database: storage/sqlite/solid_trace_test.sqlite3
  message_queue:
    <<: *default
    database: storage/sqlite/solid_trace_test_message_queue.sqlite3
    migrations_paths: db/message_queue_migrate

# Store production database in the storage/ directory, which by default
# is mounted as a persistent Docker volume in config/deploy.yml.
production:
  primary:
    <<: *default
    database: storage/sqlite/solid_trace_production.sqlite3
  cache:
    <<: *default
    database: storage/sqlite/solid_trace_production_cache.sqlite3
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: storage/sqlite/solid_trace_production_queue.sqlite3
    migrations_paths: db/queue_migrate
  message_queue:
    <<: *default
    database: storage/sqlite/solid_trace_production_message_queue.sqlite3
    migrations_paths: db/message_queue_migrate
  cable:
    <<: *default
    database: storage/sqlite/solid_trace_production_cable.sqlite3
    migrations_paths: db/cable_migrate
