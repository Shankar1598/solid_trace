name: Release images

# Builds Console's and EventStore's images for a published release and pushes
# them to GitHub Container Registry, tagged with the release's tag and latest.
# deploy/install pulls them when its checkout is at that tag.

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [console, event_store]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Name the image
        id: name
        # ghcr.io needs a lowercase owner, and the images are named solid-trace-console
        # and solid-trace-event-store.
        run: |
          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/$owner/solid-trace-$(echo '${{ matrix.app }}' | tr _ -)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.app }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:${{ github.event.release.tag_name }}
            ${{ steps.name.outputs.image }}:latest
          # Links the package to this repository on GitHub.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.event.release.tag_name }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
