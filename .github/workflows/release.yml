name: Release images and the agent CLI

# Builds Console's, EventStore's and the Dispatcher's images for a published
# release, for amd64 and arm64 (GCP's T2A, AWS's Graviton), and pushes them to
# GitHub Container Registry, tagged with the release's tag. A published release that is not a
# pre-release also moves latest, which deploy/install pulls
# (.github/scripts/image-tags).
#
# The cli job adds the agent CLI's files to the release: the solidtrace
# binary for each OS and architecture, SHA256SUMS and install.sh. The Claude
# Code plugin is not a release file: Claude Code gets it from the
# marketplace file at the repository root, at the release's tag. So the job
# fails when the tag is not the version in cli/plugin/.claude-plugin/plugin.json.
#
# The Dispatcher is the factory's service (docs/factory.md). Its image is not in
# deploy/docker-compose.yml: a SolidTrace install does not run it, and an
# operator pulls it onto the server VM beside the Nomad server. The factory job
# adds the factory's files to the release: the wrapper and the agent CLI for the
# agent VM image, the image recipe, and their SHA-256 sums
# (factory/image/release-files).
#
# Each architecture builds on its own native runner, as emulating arm64 makes
# the cgo and asset builds far slower; a last job joins the two into one tag.
# EventStore's Dockerfile builds the VRL runtime in a Rust stage, so the
# runners need no Rust; the build cache keeps that stage's dependency layer
# with every other layer (mode=max).
# Run it by hand with a release's tag to rebuild that release's CLI files.
# The cli job uploads to an existing release, and replaces files of the same
# name. For a test release, make a draft or pre-release first. A run by hand
# builds the images only when "images" is set, and never moves latest.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to build, such as v0.2.0
        required: true
      images:
        description: Also build and push the images (tagged with the release's tag only)
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  cli:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.mod

      # The binaries have no cgo, so one runner cross-builds all four.
      - name: Build the binaries and the release files
        working-directory: cli
        run: |
          ./build "$TAG"
          go run ./internal/releasefiles -dist dist -tag "$TAG" -repository "$GITHUB_REPOSITORY"
          ls -l dist

      - name: Upload the files to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" cli/dist/* --clobber --repo "$GITHUB_REPOSITORY"

  factory:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: factory/go.mod
          cache-dependency-path: factory/go.mod

      - name: Make the factory's release files
        run: factory/image/release-files factory/dist "$TAG"

      - name: Upload the files to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" factory/dist/* --clobber --repo "$GITHUB_REPOSITORY"

  build:
    if: github.event_name == 'release' || inputs.images
    strategy:
      matrix:
        app: [console, event_store, dispatcher]
        platform:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Name the image
        id: name
        # ghcr.io needs a lowercase owner, and the images are named solid-trace-console
        # and solid-trace-event-store.
        run: |
          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/$owner/solid-trace-$(echo '${{ matrix.app }}' | tr _ -)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed by digest only; the join job tags it.
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          # The Dispatcher's build needs the factory and the CLI modules, so its
          # context is the repository's root.
          context: ${{ matrix.app == 'dispatcher' && '.' || matrix.app }}
          file: ${{ matrix.app == 'dispatcher' && 'factory/Dockerfile' || format('{0}/Dockerfile', matrix.app) }}
          platforms: linux/${{ matrix.platform.arch }}
          # Console's image keeps it for its call timings; EventStore's
          # names it in prepare-clickhouse's marker; the Dispatcher's
          # binary prints it ('dispatcher version').
          build-args: |
            SOLIDTRACE_VERSION=${{ env.TAG }}
          outputs: type=image,name=${{ steps.name.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          # Links the package to this repository on GitHub.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.TAG }}
          cache-from: type=gha,scope=${{ matrix.app }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}-${{ matrix.platform.arch }}

      - name: Record the digest
        run: |
          mkdir -p digests
          echo '${{ steps.build.outputs.digest }}' > 'digests/${{ matrix.platform.arch }}'

      - name: Upload the digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.app }}-${{ matrix.platform.arch }}
          path: digests/*
          retention-days: 1

  join:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        app: [console, event_store, dispatcher]
    steps:
      # The workflow's own commit, so that a run by hand for an older tag
      # also has the script.
      - name: Checkout the tag script
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts

      - name: Download the digests
        uses: actions/download-artifact@v4
        with:
          pattern: digest-${{ matrix.app }}-*
          merge-multiple: true
          path: digests

      - name: Name the image
        id: name
        run: |
          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/$owner/solid-trace-$(echo '${{ matrix.app }}' | tr _ -)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag both architectures as one image
        env:
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          image='${{ steps.name.outputs.image }}'
          docker buildx imagetools create \
            $(sh .github/scripts/image-tags "$image" "$TAG" "$GITHUB_EVENT_NAME" "$PRERELEASE") \
            $(for f in digests/*; do echo "$image@$(cat "$f")"; done)
          docker buildx imagetools inspect "$image:$TAG"
