# Squid on the server VM: the only way out for the agent VMs (docs/factory.md). Put this file
# at /etc/squid/squid.conf. Squid allows only the hosts of the allowlist, and logs each
# request with its host.
#
# Before you start Squid, set the two lines that name your network and your SolidTrace.

http_port 3128

# The private subnet of the agent VMs: set it to yours.
acl agent_net src 10.100.0.0/24

acl CONNECT method CONNECT
acl SSL_ports port 443
acl Safe_ports port 80 443

# The Dispatcher writes this file: the default allowlist (allowlist.txt of this directory),
# the hosts of SolidTrace, and the extra hosts of each repository that a Project names.
# systemd reloads Squid when it changes (systemd/squid-allowlist.path). "-n": no reverse
# DNS lookup. With no "-n", Squid matches a URL that names an IP address by the IP's PTR
# record, which the owner of the IP sets: a host with the PTR "x.github.com" would pass.
acl allowlist dstdomain -n "/etc/squid/factory/allowlist.txt"

# SolidTrace's ingest, when its URL has a port other than 80 and 443. An install with
# HTTPS (docs/install.md) has its ingest at https://HOST:4443: the wrapper sends
# "CONNECT HOST:4443", and this is the port that is set here. For a plain http://HOST:4000
# (an install with no HTTPS), set 4000. Set the
# host to the host of DISPATCHER_SOLIDTRACE_INGEST_URL. Delete these three lines (with this
# comment) when the ingest uses 80 or 443.
acl solidtrace_host dstdomain -n solidtrace.example.com
acl solidtrace_port port 4443
http_access allow agent_net solidtrace_host solidtrace_port

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow agent_net allowlist
http_access deny all

# A forward proxy only: no cache, and no headers that name the client.
cache deny all
forwarded_for delete
via off

access_log stdio:/var/log/squid/access.log
