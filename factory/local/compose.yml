# The local factory stack (factory/local/README.md). Start and stop it with
# factory/local/stack; do not use this file for a deploy.
#
# This is the only file that names Nomad's image. Nomad is not shipped (ADR 0019).
# The whole stack is under 3 GB of memory (mem_limit on each container).
name: factory-local

x-nomad-image: &nomad-image hashicorp/nomad:2.1.1

services:
  nomad:
    image: *nomad-image
    # Copy Nomad's binary to the agent machine's volume, then start the server.
    entrypoint:
      - /bin/sh
      - -c
      - cp /bin/nomad /nomad-bin/nomad.new && mv /nomad-bin/nomad.new /nomad-bin/nomad && exec nomad agent -config=/etc/nomad.d/server.hcl
    volumes:
      - nomad-data:/nomad/data
      - nomad-bin:/nomad-bin
      - ./nomad/server.hcl:/etc/nomad.d/server.hcl:ro
    networks: [factory]
    mem_limit: 384m
    cpus: 1
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4646/v1/status/leader | grep -q 4647"]
      interval: 2s
      timeout: 2s
      retries: 30

  squid:
    image: ubuntu/squid:6.6-24.04_beta
    volumes:
      - ./squid/squid.conf:/etc/squid/squid.conf:ro
      - ../reference/squid/allowlist.txt:/etc/squid/allowlist.txt:ro
    # The only service with a way out: the egress network, and the host.
    networks: [factory, egress]
    extra_hosts:
      - host.docker.internal:host-gateway
    mem_limit: 256m
    cpus: 1

  # Owns the agent machine's network namespace and its firewall rules.
  agent-firewall:
    build: ./agent-firewall
    image: factory-local/agent-firewall:dev
    hostname: agent-machine-1
    environment:
      DISPATCHER_PORT: ${DISPATCHER_PORT:-7600}
    cap_add: [NET_ADMIN]
    networks: [factory]
    mem_limit: 32m

  agent-machine:
    build:
      context: ./agent-machine
      # agent-vm with the local take-over user (agent-machine/Dockerfile).
      target: local
    image: factory-local/agent-machine:dev
    network_mode: service:agent-firewall
    depends_on:
      agent-firewall:
        condition: service_healthy
      nomad:
        condition: service_healthy
    # SYS_ADMIN and no AppArmor profile: cgroup v2 writable, and Nomad's task mounts
    # (see agent-machine/entrypoint.sh). No NET_ADMIN, no Docker socket, not privileged.
    cap_add: [SYS_ADMIN]
    security_opt: ["apparmor:unconfined"]
    cgroup: private
    volumes:
      - nomad-bin:/opt/nomad/bin:ro
    mem_limit: 1536m
    cpus: 2
    pids_limit: 2048

networks:
  # No route out of this network. Squid is the only way out.
  factory:
    internal: true
  egress: {}

volumes:
  nomad-data:
  nomad-bin:
