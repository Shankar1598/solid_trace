# The ClickHouse server and the MinIO (S3 stand-in) that the dev stack and the
# Go tests share. Start it with bin/clickhouse-dev (bin/dev and bin/go-dev run
# it), which also copies deploy/clickhouse/'s config and waits for ClickHouse.
# It writes the variables below into .env beside this file, so plain
# docker compose -f docker-compose.dev.yml ps/logs/down work after that.
#
# One project, solidtrace-dev, serves every checkout and worktree. Data is in
# the main checkout's storage/ (SOLIDTRACE_DEV_STORAGE), which outlives
# worktrees and is gitignored.
name: solidtrace-dev

services:
  clickhouse:
    # The patch deploy/docker-compose.yml pins; change both together.
    image: clickhouse/clickhouse-server:26.8.34.13
    container_name: solidtrace-clickhouse
    restart: unless-stopped
    # The host's network, as in deploy/, so it listens on loopback only
    # (127.0.0.1:4200 native, :4201 HTTP). As the dev user, so its files stay
    # theirs.
    network_mode: host
    user: "${SOLIDTRACE_DEV_UID:?run bin/clickhouse-dev, which writes .env}:${SOLIDTRACE_DEV_GID:?run bin/clickhouse-dev}"
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"
      # EventStore's user, solidtrace, has no password here.
      SOLIDTRACE_CLICKHOUSE_PASSWORD: ""
      # About 2 GB, set inside ClickHouse. Never a compose memory limit: under
      # a cgroup limit, 26.8 returns freed pages at once and scans run about
      # 1.9x slower.
      SOLIDTRACE_CLICKHOUSE_MEMORY_BYTES: "2147483648"
      # The bucket volume EventStore writes into conf.d (clickhouse.config_dir)
      # reads its key from these. They default to MinIO's below.
      SOLIDTRACE_OBJECT_STORE_KEY_ID: "${SOLIDTRACE_OBJECT_STORE_KEY_ID:-solidtrace}"
      SOLIDTRACE_OBJECT_STORE_SECRET: "${SOLIDTRACE_OBJECT_STORE_SECRET:-solidtrace-dev}"
    volumes:
      # A copy of deploy/clickhouse/'s config that bin/clickhouse-dev takes, so
      # the container doesn't depend on a worktree that may be removed.
      - ${SOLIDTRACE_DEV_STORAGE:?run bin/clickhouse-dev, which writes .env}/clickhouse/etc/config.d:/etc/clickhouse-server/config.d:ro
      - ${SOLIDTRACE_DEV_STORAGE}/clickhouse/etc/users.d:/etc/clickhouse-server/users.d:ro
      - ${SOLIDTRACE_DEV_STORAGE}/clickhouse/conf.d:/etc/clickhouse-server/conf.d:ro
      - ${SOLIDTRACE_DEV_STORAGE}/clickhouse/data:/var/lib/clickhouse
      # Old Log files, read in place.
      - ${SOLIDTRACE_DEV_STORAGE}/duckdb/development/logs_parquet:/logs_parquet:ro
    depends_on:
      minio-buckets:
        condition: service_completed_successfully

  # MinIO no longer publishes images; Bitnami's legacy one carries minio and
  # mc. Its setup scripts can't run as the dev user, so both call the binaries
  # directly.
  minio:
    image: &minio bitnamilegacy/minio:2025.7.23-debian-12-r5
    container_name: solidtrace-minio
    restart: unless-stopped
    user: "${SOLIDTRACE_DEV_UID}:${SOLIDTRACE_DEV_GID}"
    entrypoint: ["minio", "server", "/data", "--address", ":9000", "--console-address", ":9001"]
    ports:
      - "127.0.0.1:9000:9000" # S3 API
      - "127.0.0.1:9001:9001" # console
    environment:
      # A development key, also the Go tests' default (pkg/clickhousetest).
      MINIO_ROOT_USER: solidtrace
      MINIO_ROOT_PASSWORD: solidtrace-dev
    volumes:
      - ${SOLIDTRACE_DEV_STORAGE}/minio:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 1s
      retries: 30

  # Makes the Go tests' bucket and one for the dev stack's object_store
  # (docs/logs/object-store.md) when they're missing, then exits.
  minio-buckets:
    image: *minio
    user: "${SOLIDTRACE_DEV_UID}:${SOLIDTRACE_DEV_GID}"
    environment:
      MC_CONFIG_DIR: /tmp/mc
    entrypoint:
      - sh
      - -c
      - >-
        mc alias set dev http://minio:9000 solidtrace solidtrace-dev &&
        mc mb --ignore-existing dev/solidtrace-test dev/solidtrace-dev
    depends_on:
      minio:
        condition: service_healthy
