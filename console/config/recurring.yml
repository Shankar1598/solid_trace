# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day
#
# Solid Queue takes only the block named after the environment when there
# is one, so the tasks every environment runs are shared through &tasks.

tasks: &tasks
  event_store_message_processor:
    class: EventStoreMessageProcessorJob
    schedule: every second

  monitor_scheduler:
    class: MonitorSchedulerJob
    schedule: every minute

  maintenance_notification_cleanup:
    class: "Maintenance::NotificationCleanupJob"
    schedule: at 3am every day

development:
  <<: *tasks

test:
  <<: *tasks

production:
  <<: *tasks
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
