# SQLite. Versions 3.8.0 and up are supported.
#   gem install sqlite3
#
#   Ensure the SQLite 3 gem is defined in your Gemfile
#   gem "sqlite3"
#
default: &default
  adapter: sqlite3
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000
  pragmas:
    journal_mode: wal
    synchronous: normal

development:
  primary:
    <<: *default
    database: ../storage/sqlite/development/solid_trace.sqlite3
  queue:
    <<: *default
    database: ../storage/sqlite/development/queue.sqlite3
    migrations_paths: db/queue_migrate
  message_queue:
    <<: *default
    database: ../storage/sqlite/development/message_queue.sqlite3
    migrations_paths: db/message_queue_migrate
  cache:
    <<: *default
    database: ../storage/sqlite/development/cache.sqlite3
    migrations_paths: db/cache_migrate

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  primary:
    <<: *default
    database: ../storage/sqlite/test/solid_trace.sqlite3
  message_queue:
    <<: *default
    database: ../storage/sqlite/test/message_queue.sqlite3
    migrations_paths: db/message_queue_migrate

# Store production database in the storage/ directory.
production:
  primary:
    <<: *default
    database: ../storage/sqlite/production/solid_trace.sqlite3
  cache:
    <<: *default
    database: ../storage/sqlite/production/cache.sqlite3
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: ../storage/sqlite/production/queue.sqlite3
    migrations_paths: db/queue_migrate
  message_queue:
    <<: *default
    database: ../storage/sqlite/production/message_queue.sqlite3
    migrations_paths: db/message_queue_migrate
  # cable:
  #   <<: *default
  #   database: ../storage/sqlite/production/cable.sqlite3
  #   migrations_paths: db/cable_migrate
